# Enable true color support
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",alacritty:Tc"
set -ga terminal-overrides ",*256col*:Tc"
# Change prefix to Ctrl+Space
unbind C-b
set -g prefix C-Space
bind Space send-prefix

# Set mouse on
set -g mouse on

# Set tab to start at 1
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

bind -n M-H run previous-window
bind -n M-L run next-window

# Set vim-like copy mode
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Set split to open in cwd
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"


# pane navigation
bind -r h select-pane -L  # move left
bind -r j select-pane -D  # move down
bind -r k select-pane -U  # move up
bind -r l select-pane -R  # move right
bind > swap-pane -D       # swap current pane with the next one
bind < swap-pane -U       # swap current pane with the previous one

# maximize current pane
bind + run 'cut -c3- ~/.tmux.conf | sh -s _maximize_pane "#{session_name}" #D'

# pane resizing
bind -r H resize-pane -L 2
bind -r J resize-pane -D 2
bind -r K resize-pane -U 2
bind -r L resize-pane -R 2

# window navigation
unbind n
unbind p
bind -r C-h previous-window # select previous window
bind -r C-l next-window     # select next window
bind Tab last-window        # move to last active window
# split current window horizontally
bind - split-window -v
# split current window vertically
bind _ split-window -h

# # Window appearance
# setw -g automatic-rename on   # rename window to reflect current program
#
# set -g status-right "#(cd #{pane_current_path}; git rev-parse --abbrev-ref HEAD)"
# set -g status-right-length 200

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-sensible'

### Themes ###
set -g status-position top
set -g @plugin 'dracula/tmux'
set -g @dracula-plugins "wifi battery time"

# Use Dracula's default gray for the bar and its darker gray for the active window.
set -g @dracula-colors '
  green=$gray
  yellow=$gray
  dark_purple=$dark_gray
  white="#eef0f4"
  dark_gray=$white
  light_purple="#737aa2"
'
set -g @dracula-battery-colors "gray white"
set -g @dracula-time-colors "gray white"
set -g @dracula-border-contrast true

set -g @dracula-battery-label false
set -g @dracula-show-battery-status false
set -g @dracula-military-time true
# Double % so each date command receives its format in its own time zone.
set -g @dracula-time-format "#(TZ=America/Los_Angeles date '+%%b %%d %%-H:%%M') (#(TZ=Europe/Zurich date '+%%-H:%%M %%Z'))"


set -g window-style 'bg=#222236'
set -g window-active-style 'bg=#222236'


# tmux is configured in dotfiles, but I don't want to store plugins in my config repository.
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.tmux/plugins/'
set-environment -g PATH "/opt/homebrew/bin:/bin:/usr/bin"
run '~/.tmux/plugins/tpm/tpm'

set -g window-status-current-style bold
set -g status-left-style '#{?client_prefix,bold underscore,none}'

# Keep inactive splits visible against the pane background.
set -g pane-border-style 'fg=#3b4261'

# Add the level icon to the battery percentages in Dracula's generated status line.
set -gF status-right '#{s@/battery[.]sh[)]@/battery.sh | awk -f ~/.config/tmux/battery-level.awk)@:status-right}'
